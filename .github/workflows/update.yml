name: Update Road Data

on:
  schedule:
    - cron: "*/5 * * * *"  # 每 5 分鐘執行一次 (UTC)
  workflow_dispatch:        # 手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install requests

    - name: Run update script
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        # 嘗試運行 update.py，如果下載失敗仍然不會中斷 workflow
        python update.py || echo "Update script failed, skipping download"

    - name: Commit and push JSON (always)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add data/road_data.json data/road_data_raw.json
        git commit -m "Auto update data" || echo "No changes to commit"
        git push
