name: Update Road Data

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘執行一次 (UTC)
  workflow_dispatch:        # 可手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run update script
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python update.py

    - name: Commit and push JSON always
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add data/road_data.json data/road_data_raw.json
        # 無論檔案是否變動，都 commit（避免 commit 空訊息，可加時間）
        git commit -m "Auto update data $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push https://${GH_TOKEN}@github.com/${{ github.repository }}.git
