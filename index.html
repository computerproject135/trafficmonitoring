<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>台灣即時交通事件地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
  body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 20px;
  }

  h2 {
    text-align: center;
  }

  #map {
    height: 600px;
    width: 100%;
    border-radius: 10px;
    margin-bottom: 10px;
  }

  #search-container {
    text-align: center;
    margin-bottom: 10px;
  }

  #search-input {
    width: 50%;
    padding: 6px;
    font-size: 16px;
  }

  #loading {
    text-align: center;
    font-weight: bold;
    color: #555;
    display: none;
    margin-bottom: 5px;
  }

  #last-update {
    font-weight: bold;
    margin-bottom: 5px;
  }

  #event-list {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  .event-item {
    padding: 6px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
  }

  .event-item:hover {
    background-color: #f5f5f5;
  }

  /* 手機版 */
  @media (max-width: 768px) {
    body { margin: 10px; }
    #map { height: 70vh; }
    #search-input { width: 90%; font-size: 18px; }
    #event-list { max-height: 40vh; }
  }
</style>
</head>

<body>

<h2>台灣即時交通事件地圖</h2>

<div id="search-container">
  <input type="text" id="search-input" placeholder="搜尋事件類型或描述">
</div>

<div id="loading">資料更新中...</div>
<div id="map"></div>
<div id="last-update">上次更新時間：--</div>
<div id="event-list"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* ------------------ 地圖初始化 ------------------ */
const map = L.map('map').setView([23.7, 120.9], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

/* ------------------ 變數 ------------------ */
const jsonUrl =
  "https://raw.githubusercontent.com/computerproject135/trafficmonitoring/main/data/road_data.json";

let markers = [];
let allEvents = [];
let lastUpdateTime = "";
let firstLoad = true;

/* ------------------ 類型顏色 ------------------ */
const categoryColors = {
  "事故": "red",
  "阻塞": "black",
  "交通管制": "purple",
  "道路施工": "orange",
  "其他": "blue"
};

/* ------------------ 載入資料（對齊 result） ------------------ */
async function loadEvents() {
  try {
    document.getElementById("loading").style.display = "block";

    const response = await fetch(jsonUrl + "?t=" + Date.now());
    if (!response.ok) throw new Error("JSON 讀取失敗");

    const json = await response.json();
    const data = json.result || [];

    /* 用最新一筆 modDttm 判斷是否更新 */
    const newestTime = data.length > 0 ? data[0].modDttm : "";

    if (lastUpdateTime && newestTime === lastUpdateTime) {
      document.getElementById("loading").style.display = "none";
      return;
    }

    lastUpdateTime = newestTime;

    document.getElementById("last-update").innerText =
      "上次更新時間：" + (newestTime || "未知");

    allEvents = data;
    displayEvents(allEvents);

    document.getElementById("loading").style.display = "none";

  } catch (err) {
    console.error(err);
    document.getElementById("loading").innerText = "資料載入失敗";
  }
}

/* ------------------ 顯示事件 ------------------ */
function displayEvents(events) {

  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const list = document.getElementById("event-list");
  list.innerHTML = "";

  let bounds = [];

  events.forEach(e => {
    const lat = parseFloat(e.y1);
    const lng = parseFloat(e.x1);
    if (isNaN(lat) || isNaN(lng)) return;

    const category = e.roadtype || "其他";
    const color = categoryColors[category] || "gray";

    const marker = L.circleMarker([lat, lng], {
      radius: 6,
      color: "#000",
      weight: 1,
      fillColor: color,
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindPopup(`
      <b style="color:${color}">${category}</b><br>
      ${e.comment || "無描述"}<br>
      <small>${e.happendate} ${e.happentime}</small><br>
      <i>來源：${e.srcdetail || "未知"}</i>
    `);

    markers.push(marker);
    bounds.push([lat, lng]);

    const div = document.createElement("div");
    div.className = "event-item";
    div.innerHTML = `
      <b style="color:${color}">${category}</b> -
      ${e.comment || "無描述"}
      <small>(${e.happendate} ${e.happentime})</small>
    `;

    div.onclick = () => {
      map.setView([lat, lng], 14);
      marker.openPopup();
    };

    list.appendChild(div);
  });

  if (bounds.length > 0 && firstLoad) {
    map.fitBounds(bounds);
    firstLoad = false;
  }

  if (events.length === 0) {
    list.innerHTML =
      '<div style="text-align:center;color:#888;">目前沒有事件</div>';
  }
}

/* ------------------ 搜尋（Debounce） ------------------ */
let searchTimer;
document.getElementById("search-input").addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const keyword = this.value.toLowerCase();
    const filtered = allEvents.filter(e =>
      (e.roadtype || "").toLowerCase().includes(keyword) ||
      (e.comment || "").toLowerCase().includes(keyword)
    );
    displayEvents(filtered);
  }, 300);
});

/* ------------------ 啟動 ------------------ */
loadEvents();
setInterval(loadEvents, 600000); // 10 分鐘更新
</script>

</body>
</html>
