<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣即時交通事件地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
  body {
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    margin: 20px;
    background-color: #f9f9f9;
  }

  h2 {
    text-align: center;
    color: #333;
  }

  #search-container {
    text-align: center;
    margin-bottom: 10px;
  }

  #search-input {
    width: 50%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }

  #loading {
    text-align: center;
    font-weight: bold;
    color: #555;
    display: none;
    margin-bottom: 5px;
  }

  #last-update {
    font-weight: bold;
    margin-bottom: 5px;
    font-size: 0.9em;
    color: #666;
  }

  /* 主容器：左地圖，右列表 */
  #main-container {
    display: flex;
    gap: 10px;
  }

  /* 地圖佔剩餘空間 */
  #map {
    flex: 1;
    height: 70vh;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  }

  /* 右側事件列表 */
  #event-list {
    flex: 0 0 300px; /* 固定寬度 */
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: white;
    padding: 5px;
  }

  .event-item {
    padding: 10px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
    transition: background 0.2s;
  }

  .event-item:hover {
    background-color: #f0f7ff;
  }

  @media (max-width: 768px) {
    #main-container {
      flex-direction: column;
    }
    #map, #event-list {
      width: 100%;
      height: 50vh;
    }
    #search-input {
      width: 90%;
      font-size: 18px;
    }
  }
</style>
</head>
<body>

<h2>台灣即時交通事件地圖</h2>

<div id="search-container">
  <input type="text" id="search-input" placeholder="搜尋關鍵字（如：國道、施工、事故）">
</div>

<div id="loading">📡 資料同步中...</div>
<div id="last-update">上次更新時間：--</div>

<div id="main-container">
  <div id="map"></div>
  <div id="event-list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
/* ------------------ 1. 地圖初始化 ------------------ */
const map = L.map('map').setView([23.7, 120.9], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap 貢獻者'
}).addTo(map);

/* ------------------ 2. 全域變數 ------------------ */
const jsonUrl = "https://raw.githubusercontent.com/computerproject135/trafficmonitoring/main/data/road_data.json";

let markers = [];
let allEvents = [];
let lastUpdateTime = "";
let firstLoad = true;

/* ------------------ 3. 顏色分類 ------------------ */
const categoryColors = {
  "事故": "red",
  "阻塞": "black",
  "交通管制": "purple",
  "道路施工": "orange",
  "其他": "blue"
};

/* ------------------ 4. 載入資料 ------------------ */
async function loadEvents() {
  try {
    document.getElementById("loading").style.display = "block";

    const response = await fetch(jsonUrl + "?t=" + Date.now());
    if (!response.ok) throw new Error("JSON 讀取失敗");

    const json = await response.json();
    const data = json.result || [];

    const newestTime = data.length > 0 ? data[0].modDttm : "";
    if (lastUpdateTime && newestTime === lastUpdateTime) {
      document.getElementById("loading").style.display = "none";
      console.log("資料無更動，跳過重繪");
      return;
    }

    lastUpdateTime = newestTime;
    document.getElementById("last-update").innerText = "資料時間：" + (newestTime || "未知");

    allEvents = data;
    displayEvents(allEvents);

    document.getElementById("loading").style.display = "none";

  } catch (err) {
    console.error(err);
    document.getElementById("loading").innerText = "❌ 資料載入失敗，請稍後再試";
  }
}

/* ------------------ 5. 顯示事件 ------------------ */
function displayEvents(events) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const list = document.getElementById("event-list");
  list.innerHTML = "";

  let bounds = [];

  events.forEach(e => {
    const lat = parseFloat(e.y1);
    const lng = parseFloat(e.x1);
    if (isNaN(lat) || isNaN(lng)) return;

    const category = e.roadtype || "其他";
    const color = categoryColors[category] || "gray";

    const marker = L.circleMarker([lat, lng], {
      radius: 6,
      color: "#000",
      weight: 1,
      fillColor: color,
      fillOpacity: 0.8
    }).addTo(map);

    marker.bindPopup(`
      <b style="color:${color}">${category}</b><br>
      <b>描述：</b>${e.comment || "無描述"}<br>
      <b>時間：</b><small>${e.happendate} ${e.happentime}</small><br>
      <i>來源：${e.srcdetail || "未知"}</i>
    `);

    markers.push(marker);
    bounds.push([lat, lng]);

    const div = document.createElement("div");
    div.className = "event-item";
    div.innerHTML = `
      <b style="color:${color}">${category}</b> - 
      ${e.comment || "無描述"}<br>
      <small style="color:gray;">(${e.happendate} ${e.happentime})</small>
    `;

    div.onclick = () => {
      map.setView([lat, lng], 14);
      marker.openPopup();
    };

    list.appendChild(div);
  });

  if (bounds.length > 0 && firstLoad) {
    map.fitBounds(bounds);
    firstLoad = false;
  }

  if (events.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:#888;">目前沒有符合條件的事件</div>';
  }
}

/* ------------------ 6. 搜尋功能 ------------------ */
let searchTimer;
document.getElementById("search-input").addEventListener("input", function () {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const keyword = this.value.toLowerCase().trim();
    const filtered = allEvents.filter(e =>
      (e.roadtype || "").toLowerCase().includes(keyword) ||
      (e.comment || "").toLowerCase().includes(keyword) ||
      (e.srcdetail || "").toLowerCase().includes(keyword)
    );
    displayEvents(filtered);
  }, 300);
});

/* ------------------ 7. 啟動 ------------------ */
loadEvents();
setInterval(loadEvents, 600000);
</script>

</body>
</html>
