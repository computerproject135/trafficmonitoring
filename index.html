<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣即時交通事件地圖</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
/* ===== 全畫面鎖定 ===== */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* 🔑 不讓整頁捲 */
  font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
  background: #f9f9f9;
}

/* ===== Header ===== */
#header {
  text-align: center;
  padding: 6px 0;
}

h2 {
  margin: 4px 0;
  font-size: 1.2em;
}

#search-input {
  width: 90%;
  max-width: 500px;
  padding: 8px;
  font-size: 16px;
}

/* ===== 主畫面 ===== */
#main-container {
  display: flex;
  height: calc(100svh - 110px); /* 🔑 穩定高度 */
  gap: 6px;
  padding: 6px;
  box-sizing: border-box;
}

/* 地圖 */
#map {
  flex: 1;
  border-radius: 8px;
}

/* 事件列表 */
#event-list {
  width: 320px;
  background: #fff;
  border-radius: 6px;
  overflow-y: auto; /* ✅ 只有這裡能捲 */
  border: 1px solid #ccc;
}

.event-item {
  padding: 10px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.event-item:hover {
  background: #f0f7ff;
}

/* ===== 📱 手機版（左右排） ===== */
@media (max-width: 768px) {
  #main-container {
    flex-direction: row; /* 🔑 關鍵：手機仍左右排 */
  }

  #map {
    width: 65%;
  }

  #event-list {
    width: 35%;
  }

  h2 {
    font-size: 1.05em;
  }
}
</style>
</head>

<body>

<div id="header">
  <h2>台灣即時交通事件地圖</h2>
  <input id="search-input" placeholder="搜尋：事故、施工、國道">
</div>

<div id="main-container">
  <div id="map"></div>
  <div id="event-list"></div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map', {
  zoomControl: true,
  tap: true
}).setView([23.7, 120.9], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

/* 📱 手機可縮放 */
if (window.innerWidth < 768) {
  map.scrollWheelZoom.disable(); // 防誤觸
}

/* 範例事件（你可接回 JSON） */
const list = document.getElementById("event-list");
for (let i = 1; i <= 10; i++) {
  const div = document.createElement("div");
  div.className = "event-item";
  div.innerHTML = `<b>事故</b><br>國道 ${i} 號發生事故`;
  list.appendChild(div);
}
</script>

</body>
</html>
